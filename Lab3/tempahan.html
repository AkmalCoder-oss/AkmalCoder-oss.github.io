<!DOCTYPE html>
<html lang="ms" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempahan Direct | SMJ Homestay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ocean: { light: '#38BDF8', primary: '#0284C7', deep: '#1E40AF' },
                        coastal: { sand: '#F8FAFC', soft: '#F1F5F9', card: '#FFFFFF' }
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- AOS Animation Library -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <style>
        .hero-bg { background: linear-gradient(to bottom, rgba(15, 23, 42, 0.55), rgba(15, 23, 42, 0.8)), url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat; }
        .ocean-badge { background: linear-gradient(135deg, #0284C7 0%, #1E40AF 100%); }
        .ocean-gradient-text { background: linear-gradient(135deg, #38BDF8 0%, #0284C7 50%, #60A5FA 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Custom Keyframe Animations */
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.4); }
            50% { transform: scale(1.03); box-shadow: 0 20px 35px -5px rgba(2, 132, 199, 0.6); }
        }
        .animate-pulse-glow { animation: pulseGlow 3s infinite ease-in-out; }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float { animation: floatSlow 4s infinite ease-in-out; }
    </style>

</head>
<body class="bg-coastal-sand text-slate-800 font-sans overflow-x-hidden">
    <nav class="fixed top-0 left-0 right-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-100 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <a href="index.html" class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl ocean-badge flex items-center justify-center text-white font-serif text-xl font-bold">S</div>
                    <div>
                        <span class="text-xl font-serif font-bold text-slate-900 block leading-tight">SMJ HOMESTAY</span>
                        <span class="text-xs text-sky-600 font-medium tracking-widest uppercase">Tanjung Aru • Kota Kinabalu</span>
                    </div>
                </a>
                <div class="hidden md:flex items-center space-x-2">
                    <a href="index.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:text-sky-600 hover:bg-sky-50">Utama</a>
                    <a href="bilik.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:text-sky-600 hover:bg-sky-50">Penginapan 3 Bilik</a>
                    <a href="panduan.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:text-sky-600 hover:bg-sky-50">Panduan Lokasi KK</a>
                    <a href="harga.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:text-sky-600 hover:bg-sky-50">Harga & Pakej</a>
                    <a href="tempahan.html" class="px-3 py-2 rounded-lg text-sm font-semibold text-sky-600 bg-sky-50">Tempahan Direct</a>
                    <a href="hubungi.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:text-sky-600 hover:bg-sky-50">Hubungi / FAQ</a>
                </div>
                <div class="hidden md:flex items-center gap-3">
                    <a href="tempahan.html" class="px-5 py-2.5 rounded-xl ocean-badge text-white font-semibold text-sm">Tempah Sekarang</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="py-32 bg-coastal-soft">
        <div data-aos="zoom-in" class="max-w-3xl mx-auto px-4 bg-white p-8 sm:p-10 rounded-3xl shadow-xl border border-slate-100">
            <h1 class="text-3xl font-serif font-bold text-center mb-6">Borang Tempahan Direct</h1>
            <form onsubmit="submitWhatsApp(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase mb-1">Nama Penuh</label>
                    <input type="text" id="name" required class="w-full p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-sky-500 transition-all">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase mb-1">Check-in</label>
                        <input type="date" id="checkin" required class="w-full p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-sky-500 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase mb-1">Check-out</label>
                        <input type="date" id="checkout" required class="w-full p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-sky-500 transition-all">
                    </div>
                </div>
                <button type="submit" class="w-full py-4 rounded-xl ocean-badge text-white font-bold text-base shadow-lg shadow-sky-500/25 hover:scale-[1.01] transition-all">Hantar Tempahan ke WhatsApp</button>
            </form>
        </div>
    </section>
    <script>
        function submitWhatsApp(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const checkin = document.getElementById('checkin').value;
            const checkout = document.getElementById('checkout').value;
            window.open(`https://wa.me/601121458938?text=Hai%20SMJ%20Homestay,%20saya%20${name}%20nak%20tempah%20tarikh%20${checkin}%20hingga%20${checkout}.`, '_blank');
        }
    </script>
    <!-- AOS Script & Lucide Icons -->
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        lucide.createIcons();
        AOS.init({
            duration: 800,
            once: true,
            easing: 'ease-out-cubic'
        });
    </script>


    <!-- Floating Audio Player for 'Hanya di Sabah - Dabra Sia' -->
    <div data-aos="fade-up" data-aos-delay="500" class="fixed bottom-6 right-6 z-50 bg-slate-900/95 backdrop-blur-md text-white p-4 rounded-2xl shadow-2xl border border-sky-500/30 flex items-center gap-4 max-w-sm">
        <div class="w-12 h-12 rounded-xl ocean-badge flex items-center justify-center shrink-0 animate-pulse">
            <i data-lucide="music" class="w-6 h-6 text-white"></i>
        </div>
        <div class="flex-1 min-w-0">
            <p class="text-xs text-sky-400 font-semibold uppercase tracking-wider">Lagu Tema Sabah</p>
            <h4 class="text-sm font-bold truncate">Hanya Di Sabah</h4>
            <p class="text-xs text-slate-300 truncate">Dabra Sia</p>
            <audio id="sabahAudio" class="hidden" loop>
                <source src="hanya_di_sabah.mp3" type="audio/mp3">
            </audio>
        </div>
        <button onclick="toggleAudio()" id="playBtn" class="w-10 h-10 rounded-full bg-sky-500 hover:bg-sky-400 flex items-center justify-center text-white transition-all shadow-md shadow-sky-500/40">
            <i data-lucide="play" id="playIcon" class="w-5 h-5 ml-0.5"></i>
        </button>
    </div>

    <script>
        function toggleAudio() {
            const audio = document.getElementById('sabahAudio');
            const playIcon = document.getElementById('playIcon');
            if (audio.paused) {
                audio.play();
                playIcon.setAttribute('data-lucide', 'pause');
            } else {
                audio.pause();
                playIcon.setAttribute('data-lucide', 'play');
            }
            lucide.createIcons();
        }
    </script>

</body>
</html>
